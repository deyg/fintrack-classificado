# Contrato de gates do CI — espelha scripts/validate-step.ps1.
# Nenhuma etapa tolera falha: gate indisponível ou falho derruba o job.
# build-test: testes sem banco (inclui ArchitectureTests). sql-server: SQL Server real efêmero,
# suíte completa (Integration + Contract) com cobertura (DEC-OPS-003: somente relatório, sem limite).
# gates: agregador único; só fica verde se ambos os jobs estiverem verdes.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Manifesto do roadmap e contrato (G9)
        shell: pwsh
        run: ./scripts/verify-manifest.ps1

      - name: Regras de referência entre projetos (G3 estático)
        shell: pwsh
        run: ./scripts/check-architecture.ps1

      - name: Restore
        run: dotnet restore FinTrack.sln

      - name: Build
        run: dotnet build FinTrack.sln -c Release --no-restore

      - name: Test sem banco (inclui ArchitectureTests; Integration/Contract rodam no job sql-server)
        run: dotnet test FinTrack.sln -c Release --no-build --filter "FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~ContractTests" --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Publicar resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error

  sql-server:
    name: sql-server (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar .env efêmero com senha aleatória
        shell: bash
        run: |
          password="Ci_$(openssl rand -hex 12)Aa1#"
          echo "::add-mask::${password}"
          printf 'MSSQL_SA_PASSWORD=%s\nMSSQL_PORT=14330\n' "${password}" > .env

      - name: Validar compose e subir SQL Server saudável (G4)
        run: |
          docker compose config --quiet
          docker compose up -d --wait sqlserver

      - name: Probe de conectividade
        shell: pwsh
        run: ./scripts/probe-sqlserver.ps1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Suíte completa contra SQL Server real, com cobertura (G5/G6)
        run: dotnet test FinTrack.sln -c Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/sql-results

      - name: Resumo de cobertura (linhas e ramos; sem limite)
        if: always()
        shell: pwsh
        run: |
          $file = Get-ChildItem artifacts/sql-results -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $file) { throw 'Nenhum XML Cobertura gerado.' }
          $c = ([xml](Get-Content $file.FullName)).coverage
          $line = '{0:P2} ({1}/{2})' -f [double]$c.'line-rate', $c.'lines-covered', $c.'lines-valid'
          $branch = '{0:P2} ({1}/{2})' -f [double]$c.'branch-rate', $c.'branches-covered', $c.'branches-valid'
          "Cobertura: linhas $line; ramos $branch" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Publicar resultados e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-server-results
          path: artifacts/sql-results
          if-no-files-found: error

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v

  gates:
    name: gates (agregador)
    if: always()
    needs: [build-test, sql-server]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir todos os gates verdes
        shell: bash
        run: |
          test "${{ needs.build-test.result }}" = "success"
          test "${{ needs.sql-server.result }}" = "success"
