# Contrato de gates do CI — espelha scripts/validate-step.ps1.
# Nenhuma etapa tolera falha: gate indisponível ou falho derruba o job.
# Passos futuros (cobertura, ContractTests, IntegrationTests) entram aqui quando seus gates existirem.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Manifesto do roadmap e contrato (G9)
        shell: pwsh
        run: ./scripts/verify-manifest.ps1

      - name: Regras de referência entre projetos (G3 estático)
        shell: pwsh
        run: ./scripts/check-architecture.ps1

      - name: Restore
        run: dotnet restore FinTrack.sln

      - name: Build
        run: dotnet build FinTrack.sln -c Release --no-restore

      - name: Test (inclui ArchitectureTests)
        run: dotnet test FinTrack.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Publicar resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error

  sql-server:
    name: sql-server (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar .env efêmero com senha aleatória
        shell: bash
        run: |
          password="Ci_$(openssl rand -hex 12)Aa1#"
          echo "::add-mask::${password}"
          printf 'MSSQL_SA_PASSWORD=%s\nMSSQL_PORT=14330\n' "${password}" > .env

      - name: Validar compose e subir SQL Server saudável (G4)
        run: |
          docker compose config --quiet
          docker compose up -d --wait sqlserver

      - name: Probe de conectividade
        shell: pwsh
        run: ./scripts/probe-sqlserver.ps1

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v
